naftiko: 1.0.0-alpha2
info:
  label: OpenReplay API — Assist
  description: 'OpenReplay API — Assist. 2 operations. Lead operation: List live sessions. Self-contained Naftiko capability
    covering one Openreplay business surface.'
  tags:
  - Openreplay
  - Assist
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENREPLAY_API_KEY: OPENREPLAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: openreplay-assist
    baseUri: https://api.openreplay.com/v2
    description: OpenReplay API — Assist business capability. Self-contained, no shared references.
    resources:
    - name: public-projectKey-assist-sessions
      path: /public/{projectKey}/assist/sessions
      operations:
      - name: listlivesessions
        method: GET
        description: List live sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: query
          type: string
      - name: searchlivesessions
        method: POST
        description: Search live sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.OPENREPLAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: openreplay-assist-rest
    port: 8080
    description: REST adapter for OpenReplay API — Assist. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/public/{projectkey}/assist/sessions
      name: public-projectkey-assist-sessions
      description: REST surface for public-projectKey-assist-sessions.
      operations:
      - method: GET
        name: listlivesessions
        description: List live sessions
        call: openreplay-assist.listlivesessions
        with:
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: searchlivesessions
        description: Search live sessions
        call: openreplay-assist.searchlivesessions
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openreplay-assist-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenReplay API — Assist. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-live-sessions
      description: List live sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-assist.listlivesessions
      with:
        userId: tools.userId
      outputParameters:
      - type: object
        mapping: $.
    - name: search-live-sessions
      description: Search live sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: openreplay-assist.searchlivesessions
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
