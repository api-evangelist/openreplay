naftiko: 1.0.0-alpha2
info:
  label: OpenReplay API — Jobs
  description: 'OpenReplay API — Jobs. 3 operations. Lead operation: List jobs. Self-contained Naftiko capability covering
    one Openreplay business surface.'
  tags:
  - Openreplay
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENREPLAY_API_KEY: OPENREPLAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: openreplay-jobs
    baseUri: https://api.openreplay.com/v2
    description: OpenReplay API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: public-projectKey-jobs
      path: /public/{projectKey}/jobs
      operations:
      - name: listjobs
        method: GET
        description: List jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: page
          in: query
          type: integer
    - name: public-projectKey-jobs-jobId
      path: /public/{projectKey}/jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Get job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: canceljob
        method: DELETE
        description: Cancel job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPENREPLAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: openreplay-jobs-rest
    port: 8080
    description: REST adapter for OpenReplay API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/public/{projectkey}/jobs
      name: public-projectkey-jobs
      description: REST surface for public-projectKey-jobs.
      operations:
      - method: GET
        name: listjobs
        description: List jobs
        call: openreplay-jobs.listjobs
        with:
          limit: rest.limit
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/public/{projectkey}/jobs/{jobid}
      name: public-projectkey-jobs-jobid
      description: REST surface for public-projectKey-jobs-jobId.
      operations:
      - method: GET
        name: getjob
        description: Get job
        call: openreplay-jobs.getjob
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: canceljob
        description: Cancel job
        call: openreplay-jobs.canceljob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openreplay-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenReplay API — Jobs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-jobs
      description: List jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-jobs.listjobs
      with:
        limit: tools.limit
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-job
      description: Get job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-jobs.getjob
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-job
      description: Cancel job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: openreplay-jobs.canceljob
      outputParameters:
      - type: object
        mapping: $.
