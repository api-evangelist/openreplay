naftiko: 1.0.0-alpha2
info:
  label: OpenReplay API — Events
  description: 'OpenReplay API — Events. 1 operations. Lead operation: List session events. Self-contained Naftiko capability
    covering one Openreplay business surface.'
  tags:
  - Openreplay
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENREPLAY_API_KEY: OPENREPLAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: openreplay-events
    baseUri: https://api.openreplay.com/v2
    description: OpenReplay API — Events business capability. Self-contained, no shared references.
    resources:
    - name: public-projectKey-sessions-sessionId-events
      path: /public/{projectKey}/sessions/{sessionId}/events
      operations:
      - name: listsessionevents
        method: POST
        description: List session events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.OPENREPLAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: openreplay-events-rest
    port: 8080
    description: REST adapter for OpenReplay API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/public/{projectkey}/sessions/{sessionid}/events
      name: public-projectkey-sessions-sessionid-events
      description: REST surface for public-projectKey-sessions-sessionId-events.
      operations:
      - method: POST
        name: listsessionevents
        description: List session events
        call: openreplay-events.listsessionevents
        with:
          sessionId: rest.sessionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openreplay-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenReplay API — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-session-events
      description: List session events
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: openreplay-events.listsessionevents
      with:
        sessionId: tools.sessionId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
