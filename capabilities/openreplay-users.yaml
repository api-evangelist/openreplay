naftiko: 1.0.0-alpha2
info:
  label: OpenReplay API — Users
  description: 'OpenReplay API — Users. 3 operations. Lead operation: Search users. Self-contained Naftiko capability covering
    one Openreplay business surface.'
  tags:
  - Openreplay
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENREPLAY_API_KEY: OPENREPLAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: openreplay-users
    baseUri: https://api.openreplay.com/v2
    description: OpenReplay API — Users business capability. Self-contained, no shared references.
    resources:
    - name: public-projectKey-users
      path: /public/{projectKey}/users
      operations:
      - name: searchusers
        method: POST
        description: Search users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: public-projectKey-users-userId
      path: /public/{projectKey}/users/{userId}
      operations:
      - name: getuser
        method: GET
        description: Get user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteuser
        method: DELETE
        description: Delete user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPENREPLAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: openreplay-users-rest
    port: 8080
    description: REST adapter for OpenReplay API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/public/{projectkey}/users
      name: public-projectkey-users
      description: REST surface for public-projectKey-users.
      operations:
      - method: POST
        name: searchusers
        description: Search users
        call: openreplay-users.searchusers
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/public/{projectkey}/users/{userid}
      name: public-projectkey-users-userid
      description: REST surface for public-projectKey-users-userId.
      operations:
      - method: GET
        name: getuser
        description: Get user
        call: openreplay-users.getuser
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteuser
        description: Delete user
        call: openreplay-users.deleteuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openreplay-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenReplay API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: search-users
      description: Search users
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: openreplay-users.searchusers
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-users.getuser
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-user
      description: Delete user
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: openreplay-users.deleteuser
      outputParameters:
      - type: object
        mapping: $.
