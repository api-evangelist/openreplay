naftiko: 1.0.0-alpha2
info:
  label: OpenReplay API — Projects
  description: 'OpenReplay API — Projects. 3 operations. Lead operation: List projects. Self-contained Naftiko capability
    covering one Openreplay business surface.'
  tags:
  - Openreplay
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENREPLAY_API_KEY: OPENREPLAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: openreplay-projects
    baseUri: https://api.openreplay.com/v2
    description: OpenReplay API — Projects business capability. Self-contained, no shared references.
    resources:
    - name: public-projects
      path: /public/projects
      operations:
      - name: listprojects
        method: GET
        description: List projects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createproject
        method: POST
        description: Create project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: public-projects-projectKey
      path: /public/projects/{projectKey}
      operations:
      - name: getproject
        method: GET
        description: Get project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.OPENREPLAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: openreplay-projects-rest
    port: 8080
    description: REST adapter for OpenReplay API — Projects. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/public/projects
      name: public-projects
      description: REST surface for public-projects.
      operations:
      - method: GET
        name: listprojects
        description: List projects
        call: openreplay-projects.listprojects
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createproject
        description: Create project
        call: openreplay-projects.createproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/public/projects/{projectkey}
      name: public-projects-projectkey
      description: REST surface for public-projects-projectKey.
      operations:
      - method: GET
        name: getproject
        description: Get project
        call: openreplay-projects.getproject
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openreplay-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenReplay API — Projects. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-projects
      description: List projects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-projects.listprojects
      outputParameters:
      - type: object
        mapping: $.
    - name: create-project
      description: Create project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openreplay-projects.createproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-project
      description: Get project
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openreplay-projects.getproject
      outputParameters:
      - type: object
        mapping: $.
